name: Codex CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run full suite with coverage
        run: uv run --extra dev pytest --ignore=tests/benchmarks

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Import order (ruff isort)
        run: uv run --extra dev ruff check --select I src tests hooks skills bin servers

      - name: Type check (mypy)
        run: uv run --extra dev mypy --config-file=mypy.ini src/

      - name: Run pre-commit on the changed files
        env:
          FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --extra dev pre-commit run --from-ref "$FROM_REF" --to-ref "$TO_REF" --show-diff-on-failure
